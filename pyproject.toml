[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lungula"
version = "0.4.0"
description = "Game imitation learning framework — behavior cloning from replays to ONNX"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "onnx>=1.14",
    "onnxscript>=0.1",
    "onnxruntime>=1.16",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
directml = ["torch-directml"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
lungula = "lungula.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["lungula"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["scripts/"]
# README.md's illustrative snippets (e.g. the "Adding a game" walkthrough) are prose
# documentation, not real source — newer ruff releases format Markdown code fences by
# default (previously preview-only), which silently broke CI on the first push after
# ruff picked up that change since `ruff>=0.4` here is unpinned. Docs aren't ruff's job.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
